<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Farhan Islam Sekh — AI, Backend and Full-Stack Developer</title>
  <desc id="desc">A dark, cinematic technology banner with a glowing mathematical neural orbit, connected nodes, and a subtle animated energy path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060913"/>
      <stop offset=".52" stop-color="#0b1428"/>
      <stop offset="1" stop-color="#11152a"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55d6ff"/>
      <stop offset=".48" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#53f0c2"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f4f8ff"/>
      <stop offset=".72" stop-color="#b9d8ff"/>
      <stop offset="1" stop-color="#a9fff0"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#a9f4ff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#6d7cff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bbaff" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#91b9ff" fill-opacity=".17"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbitBack { to { transform: rotate(-360deg); } }
      @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:.95; } }
      @keyframes dash { to { stroke-dashoffset:-180; } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
      @keyframes reveal { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:translateY(0); } }
      .orbit-a { transform-origin:930px 177px; animation:orbit 46s linear infinite; }
      .orbit-b { transform-origin:930px 177px; animation:orbitBack 32s linear infinite; }
      .core-pulse { animation:breathe 5s ease-in-out infinite; }
      .energy-path { stroke-dasharray:8 13; animation:dash 15s linear infinite; }
      .float { animation:float 7s ease-in-out infinite; }
      .eyebrow { animation:reveal .8s ease-out both; }
      .headline { animation:reveal 1s .08s ease-out both; }
      .subline { animation:reveal 1s .18s ease-out both; }
      .pill { animation:reveal 1s .28s ease-out both; }
      @media (prefers-reduced-motion:reduce) {
        .orbit-a,.orbit-b,.core-pulse,.energy-path,.float,.eyebrow,.headline,.subline,.pill { animation:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="95" r="155" fill="#3569ff" opacity=".12" filter="url(#blur)"/>
  <circle cx="820" cy="310" r="130" fill="#8d5cff" opacity=".10" filter="url(#blur)"/>
  <path d="M0 305 C180 276 265 329 410 298 S650 277 760 298 S1025 327 1200 260" fill="none" stroke="url(#energy)" stroke-width="1.5" opacity=".36"/>
  <path class="energy-path" d="M0 305 C180 276 265 329 410 298 S650 277 760 298 S1025 327 1200 260" fill="none" stroke="url(#energy)" stroke-width="2.5" opacity=".8"/>

  <!-- Text block -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="66" y="48" width="5" height="18" rx="2.5" fill="url(#energy)"/>
    <text class="eyebrow" x="84" y="62" fill="#a7b9d8" font-size="14" font-weight="700" letter-spacing="3">FARHAN ISLAM SEKH</text>
    <text class="headline" x="66" y="126" fill="url(#type)" font-size="43" font-weight="760" letter-spacing="-1.4">AI × Backend × Full-Stack</text>
    <text class="subline" x="68" y="163" fill="#c4cee0" font-size="17.5">Engineering intelligent ideas into useful products.</text>

    <g class="pill">
      <rect x="67" y="195" width="203" height="37" rx="18.5" fill="#101b30" stroke="#4c8dff" stroke-opacity=".55"/>
      <circle cx="85" cy="213.5" r="3.5" fill="#63caff" filter="url(#softGlow)"/>
      <text x="98" y="218" fill="#d5e8ff" font-size="12" font-weight="700" letter-spacing="1">PYTHON · FASTAPI · REACT</text>
    </g>
    <g class="pill">
      <rect x="281" y="195" width="166" height="37" rx="18.5" fill="#17152d" stroke="#a38bff" stroke-opacity=".55"/>
      <circle cx="299" cy="213.5" r="3.5" fill="#b29cff" filter="url(#softGlow)"/>
      <text x="312" y="218" fill="#e2dcff" font-size="12" font-weight="700" letter-spacing="1">AI · GENAI · NLP</text>
    </g>
    <text x="68" y="276" fill="#8294b3" font-size="11.5" font-weight="650" letter-spacing="3">DESIGN WITH INTENT  /  BUILD WITH PURPOSE</text>
  </g>

  <!-- Mathematical neural-orbit signature -->
  <g class="core-pulse">
    <circle cx="930" cy="177" r="132" fill="url(#core)"/>
    <circle cx="930" cy="177" r="100" fill="none" stroke="#79aaff" stroke-opacity=".13"/>
    <circle cx="930" cy="177" r="75" fill="none" stroke="#79aaff" stroke-opacity=".10" stroke-dasharray="2 8"/>
  </g>
  <g class="orbit-a" fill="none" stroke="url(#energy)" stroke-width="1.2">
    <ellipse cx="930" cy="177" rx="133" ry="49" opacity=".68"/>
    <ellipse cx="930" cy="177" rx="133" ry="49" transform="rotate(60 930 177)" opacity=".62"/>
    <ellipse cx="930" cy="177" rx="133" ry="49" transform="rotate(120 930 177)" opacity=".62"/>
  </g>
  <g class="orbit-b" fill="none" stroke="#7ba8ff" stroke-width="1" stroke-dasharray="3 8" opacity=".58">
    <ellipse cx="930" cy="177" rx="151" ry="67" transform="rotate(26 930 177)"/>
    <ellipse cx="930" cy="177" rx="151" ry="67" transform="rotate(86 930 177)"/>
  </g>
  <g class="float">
    <circle cx="930" cy="177" r="38" fill="#16284b" fill-opacity=".88" stroke="#a3c7ff" stroke-opacity=".7"/>
    <circle cx="930" cy="177" r="31" fill="none" stroke="url(#energy)" stroke-opacity=".65"/>
    <path d="M914 177h32 M930 161v32" stroke="#7caaff" stroke-opacity=".35"/>
    <text x="930" y="184" text-anchor="middle" fill="#eaf7ff" font-family="Georgia,serif" font-size="25" font-style="italic">∑</text>
  </g>

  <!-- Connected nodes -->
  <g stroke="#79b8ff" stroke-opacity=".55" fill="none">
    <path d="M825 119L871 143L903 102M1001 117L1035 153L1084 139M1004 232L1046 257L1090 231M849 235L884 211L862 270" stroke-width="1.2"/>
    <path d="M871 143L862 91M1035 153L1064 185M1046 257L1017 284M884 211L904 246" stroke-opacity=".28"/>
  </g>
  <g fill="#8ddfff" filter="url(#softGlow)">
    <circle cx="825" cy="119" r="3"/><circle cx="871" cy="143" r="4"/>
    <circle cx="903" cy="102" r="2.5"/><circle cx="1001" cy="117" r="3.5"/>
    <circle cx="1035" cy="153" r="4"/><circle cx="1084" cy="139" r="2.5"/>
    <circle cx="1004" cy="232" r="3"/><circle cx="1046" cy="257" r="4"/>
    <circle cx="1090" cy="231" r="2.5"/><circle cx="849" cy="235" r="3"/>
    <circle cx="884" cy="211" r="3.5"/><circle cx="862" cy="270" r="2.5"/>
  </g>
  <g font-family="Georgia,serif" fill="#a7c5ff" opacity=".8">
    <text x="795" y="91" font-size="19">∫</text>
    <text x="1062" y="103" font-size="18">π</text>
    <text x="1091" y="281" font-size="17">∞</text>
    <text x="804" y="269" font-size="16">∂</text>
  </g>
  <g fill="#a6c7ff" opacity=".5">
    <circle cx="787" cy="173" r="1.5"/><circle cx="1105" cy="177" r="1.5"/>
    <circle cx="968" cy="47" r="1.5"/><circle cx="963" cy="307" r="1.5"/>
    <circle cx="1126" cy="203" r="1"/><circle cx="766" cy="218" r="1"/>
  </g>
  <path d="M1180 30h-25M1180 30v25M20 330h25M20 330v-25" fill="none" stroke="#7898d0" stroke-opacity=".38" stroke-width="1.5"/>
</svg>