<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Farhan Islam Sekh — Creative code in motion</title>
  <desc id="desc">An animated cybernetic canvas with glitch typography, electric orbital geometry, moving scan lines, code fragments, and a vivid neon color field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#03050b"/><stop offset=".48" stop-color="#0a0b1d"/><stop offset="1" stop-color="#071a20"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00f5ff"/><stop offset=".36" stop-color="#8a5cff"/><stop offset=".7" stop-color="#ff3cac"/><stop offset="1" stop-color="#b6ff00"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/><stop offset=".45" stop-color="#d9faff"/><stop offset=".78" stop-color="#b8a2ff"/><stop offset="1" stop-color="#6ffff0"/>
    </linearGradient>
    <radialGradient id="nebula">
      <stop stop-color="#693cff" stop-opacity=".28"/><stop offset=".55" stop-color="#00f5ff" stop-opacity=".09"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ebfff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes spinBack { to { transform:rotate(-360deg); } }
      @keyframes jitter { 0%,88%,100% { transform:translate(0,0); } 90% { transform:translate(3px,-1px); } 92% { transform:translate(-2px,1px); } 94% { transform:translate(1px,0); } }
      @keyframes flicker { 0%,19%,21%,63%,65%,100% { opacity:1; } 20%,64% { opacity:.45; } }
      @keyframes scan { from { transform:translateY(-380px); } to { transform:translateY(380px); } }
      @keyframes travel { to { stroke-dashoffset:-260; } }
      @keyframes bob { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-8px) rotate(4deg); } }
      @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
      @keyframes drift { 0%,100% { transform:translate(0,0); } 50% { transform:translate(15px,-9px); } }
      .ring-one { transform-origin:930px 178px; animation:spin 17s linear infinite; }
      .ring-two { transform-origin:930px 178px; animation:spinBack 11s linear infinite; }
      .ring-three { transform-origin:930px 178px; animation:spin 27s linear infinite; }
      .glitch { animation:jitter 6s steps(1,end) infinite; }
      .flicker { animation:flicker 7s linear infinite; }
      .scanline { animation:scan 8s linear infinite; }
      .dash { stroke-dasharray:12 18; animation:travel 8s linear infinite; }
      .bob { transform-origin:930px 178px; animation:bob 3.6s ease-in-out infinite; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; }
      .drift { animation:drift 9s ease-in-out infinite; }
      .intro { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
      @media (prefers-reduced-motion:reduce) {
        .ring-one,.ring-two,.ring-three,.glitch,.flicker,.scanline,.dash,.bob,.pulse,.drift,.intro { animation:none; }
      }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#microgrid)"/>
    <circle class="drift" cx="1010" cy="165" r="240" fill="url(#nebula)"/>
    <circle cx="1030" cy="185" r="105" fill="#ff3cac" opacity=".08" filter="url(#bigGlow)"/>
    <circle cx="810" cy="70" r="100" fill="#00f5ff" opacity=".09" filter="url(#bigGlow)"/>

    <!-- Fast-moving data rails -->
    <path d="M0 320L150 270L235 292L355 220L465 246L560 172L680 202L770 126L860 148L960 74L1200 103" fill="none" stroke="url(#neon)" stroke-width="1.3" opacity=".36"/>
    <path class="dash" d="M0 320L150 270L235 292L355 220L465 246L560 172L680 202L770 126L860 148L960 74L1200 103" fill="none" stroke="url(#neon)" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M0 44H120L140 64H220M980 320H1080L1100 300H1200" fill="none" stroke="#00f5ff" stroke-opacity=".48"/>
    <path d="M20 20h38M20 20v38M1180 340h-38M1180 340v-38" fill="none" stroke="url(#neon)" stroke-width="2"/>

    <!-- Type: less advertisement, more personal identity -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <text class="intro" x="64" y="58" fill="#8fa4c7" font-size="12" font-weight="700" letter-spacing="4">INDEPENDENTLY CURIOUS  /  CONSTANTLY BUILDING</text>
      <g class="glitch">
        <text x="61" y="132" fill="#00f5ff" opacity=".6" font-size="48" font-weight="800" letter-spacing="-1.8">FARHAN ISLAM SEKH</text>
        <text x="67" y="128" fill="#ff3cac" opacity=".5" font-size="48" font-weight="800" letter-spacing="-1.8">FARHAN ISLAM SEKH</text>
        <text x="64" y="130" fill="url(#headline)" font-size="48" font-weight="800" letter-spacing="-1.8">FARHAN ISLAM SEKH</text>
      </g>
      <text class="intro" x="67" y="171" fill="#e1e9ff" font-size="19" font-weight="500">AI <tspan fill="#00f5ff">×</tspan> Backend <tspan fill="#a98aff">×</tspan> Full-Stack</text>
      <text x="67" y="214" fill="#8b9cbd" font-size="12" letter-spacing="2.5">I TURN CURIOSITY INTO CODE.</text>
      <path d="M67 232H402" stroke="url(#neon)" stroke-width="2"/>
      <path d="M67 232H160" stroke="#fff" stroke-width="2" class="dash" filter="url(#glow)"/>
      <g class="intro" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
        <text x="68" y="265" fill="#68f7ee">while (curious) {</text>
        <text x="88" y="284" fill="#b2a2ff">  build(); learn(); repeat();</text>
        <text x="68" y="303" fill="#68f7ee">}</text>
      </g>
      <text class="flicker" x="68" y="337" fill="#7d8cad" font-size="10" letter-spacing="2">PYTHON / SYSTEMS / INTELLIGENT SOFTWARE</text>
    </g>

    <!-- A chaotic mathematical reactor, not a corporate logo -->
    <circle cx="930" cy="178" r="158" fill="url(#nebula)"/>
    <g class="ring-one" fill="none" stroke="url(#neon)" stroke-width="1.6">
      <ellipse cx="930" cy="178" rx="156" ry="48"/>
      <ellipse cx="930" cy="178" rx="156" ry="48" transform="rotate(60 930 178)"/>
      <ellipse cx="930" cy="178" rx="156" ry="48" transform="rotate(120 930 178)"/>
    </g>
    <g class="ring-two" fill="none" stroke="#00f5ff" stroke-width="1.1" stroke-dasharray="2 7" opacity=".8">
      <ellipse cx="930" cy="178" rx="171" ry="77" transform="rotate(24 930 178)"/>
      <ellipse cx="930" cy="178" rx="171" ry="77" transform="rotate(84 930 178)"/>
      <ellipse cx="930" cy="178" rx="171" ry="77" transform="rotate(144 930 178)"/>
    </g>
    <g class="ring-three" fill="none" stroke="#ff3cac" stroke-width="1" opacity=".72">
      <circle cx="930" cy="178" r="121" stroke-dasharray="26 9 3 13"/>
      <circle cx="930" cy="178" r="139" stroke-dasharray="2 15"/>
    </g>
    <g class="bob">
      <circle cx="930" cy="178" r="43" fill="#090d1e" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
      <circle cx="930" cy="178" r="34" fill="none" stroke="#d5faff" stroke-opacity=".42" stroke-dasharray="3 5"/>
      <text x="930" y="188" text-anchor="middle" fill="#f1fdff" font-family="Georgia,serif" font-size="32" font-style="italic">∑</text>
    </g>

    <!-- Orbiting sparks -->
    <g class="pulse" fill="#b6ff00" filter="url(#glow)">
      <circle cx="930" cy="22" r="3"/><circle cx="1085" cy="178" r="3"/>
      <circle cx="930" cy="334" r="3"/><circle cx="775" cy="178" r="3"/>
    </g>
    <g fill="none" stroke="#9bbaff" stroke-opacity=".62">
      <path d="M793 104l24 0 10 10M1057 85h28v20M1077 270h-22l-10-10M803 268v-19h18"/>
      <path d="M840 72l8 8m-8 0l8-8M1097 210l8 8m-8 0l8-8" stroke="#ff3cac"/>
    </g>
    <g class="flicker" font-family="ui-monospace,monospace" font-size="12" fill="#b9a6ff">
      <text x="795" y="78">0x01</text><text x="1061" y="123">AI()</text>
      <text x="1052" y="298">∞</text><text x="786" y="291">∂x</text>
    </g>
    <g fill="#d9faff" filter="url(#glow)">
      <circle cx="821" cy="114" r="2.8"/><circle cx="871" cy="92" r="1.8"/>
      <circle cx="1039" cy="103" r="2.4"/><circle cx="1080" cy="151" r="2"/>
      <circle cx="1051" cy="241" r="2.8"/><circle cx="1000" cy="270" r="1.8"/>
      <circle cx="842" cy="246" r="2.4"/><circle cx="802" cy="199" r="1.8"/>
    </g>

    <!-- One passing scan gives the whole canvas motion -->
    <g opacity=".17" class="scanline">
      <rect x="0" y="0" width="1200" height="2" fill="#d7fbff" filter="url(#glow)"/>
    </g>
  </g>
</svg>