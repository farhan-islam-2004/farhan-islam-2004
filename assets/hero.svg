<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset=".55" stop-color="#0d1b35"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <style>
  @keyframes drift {
   0%,100% { transform: translate(0,0); }
   50% { transform: translate(-18px,10px); }
  }
  @keyframes pulse {
   0%,100% { opacity: .10; }
   50% { opacity: .24; }
  }
  @keyframes flow {
   to { stroke-dashoffset: -240; }
  }
  @keyframes appear {
   from { opacity: 0; transform: translateY(8px); }
   to { opacity: 1; transform: translateY(0); }
  }
  .glow-one { animation: drift 8s ease-in-out infinite, pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .glow-two { animation: drift 10s ease-in-out infinite reverse, pulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow-line { stroke-dasharray: 18 12; animation: flow 12s linear infinite; }
  .intro { animation: appear 1s ease-out both; }
  .intro-two { animation: appear 1.2s .15s ease-out both; }
  .tag { animation: appear 1.3s .3s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
   .glow-one,.glow-two,.flow-line,.intro,.intro-two,.tag { animation: none; }
  }
 </style>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<circle class="glow-one" cx="1040" cy="60" r="110" fill="#2563eb" opacity=".12" filter="url(#blur)"/>
<circle class="glow-two" cx="180" cy="330" r="100" fill="#a371f7" opacity=".10" filter="url(#blur)"/>
<path class="flow-line" d="M0 305 C160 255 240 335 390 286 S620 250 770 300 S1000 255 1200 290" fill="none" stroke="url(#line)" stroke-width="3" opacity=".8"/>
<text class="intro" x="70" y="105" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600">FARHAN ISLAM SEKH</text>
<text class="intro-two" x="70" y="158" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="750">AI × Backend × Full-Stack</text>
<text class="intro-two" x="70" y="196" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">Building intelligent software that turns ideas into usable products.</text>
<rect class="tag" x="70" y="232" width="210" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
<text class="tag" x="175" y="259" text-anchor="middle" fill="#58a6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">PYTHON · FASTAPI · REACT</text>
<rect class="tag" x="295" y="232" width="190" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
<text class="tag" x="390" y="259" text-anchor="middle" fill="#a371f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">AI · GENAI · NLP</text>
<text x="70" y="320" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">BUILD · LEARN · IMPROVE · SHIP</text>
</svg>